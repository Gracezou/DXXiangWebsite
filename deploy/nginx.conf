# 大小象官网 — Nginx 站点配置
#
# 站点为纯静态产物（pnpm generate → .output/public），无 Node 运行时。
# 本配置对应 Lighthouse 实测所用的缓存与压缩策略：缺少这两项时
# Performance 会从 93 掉到 79，务必保持一致。
#
# 用法：
#   1. 按需修改 server_name、root、证书路径
#   2. nginx -t 校验后 reload

# ---------- HTTP：全部跳 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name www.daxiaoxiang.com daxiaoxiang.com;

    # ACME 质询目录（证书签发/续期）保持可访问
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.daxiaoxiang.com$request_uri;
    }
}

# ---------- 裸域跳 www ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name daxiaoxiang.com;

    ssl_certificate     /etc/letsencrypt/live/www.daxiaoxiang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.daxiaoxiang.com/privkey.pem;

    return 301 https://www.daxiaoxiang.com$request_uri;
}

# ---------- 主站 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.daxiaoxiang.com;

    root /var/www/daxiaoxiang/current;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/www.daxiaoxiang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.daxiaoxiang.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- 压缩 ----------
    # 站点访客主要在国内、服务器在新加坡，跨境带宽是瓶颈，压缩不能省。
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # 若已编译 ngx_brotli，取消注释以获得更好的压缩率
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_types      text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- 旧链接重定向 ----------
    # v1.0 的路由拼写错误。静态产物本身不含真正的 301：Nitro 会为它生成
    # 一个 <meta http-equiv="refresh"> 页面，那对 SEO 不传递权重，
    # 必须由这里发出真正的 301。
    location = /abort {
        return 301 /about;
    }
    location = /abort/ {
        return 301 /about;
    }
    location = /en/abort {
        return 301 /en/about;
    }

    # ---------- 带指纹的静态资源：长缓存 ----------
    # 文件名含内容哈希，内容变了文件名就变，可以放心 immutable。
    location ^~ /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 图片转换产物：路径含尺寸与格式参数，同样可长缓存
    location ^~ /_ipx/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    location ^~ /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # i18n 语言包：路径含内容哈希（/_i18n/<hash>/…），可长缓存
    location ^~ /_i18n/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /favicon.ico {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---------- HTML：不缓存 ----------
    # 内容更新后必须立刻生效，且 HTML 体积小，不缓存的代价可接受。
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # _payload.json 是各页面的数据，客户端导航时取用。
    # 它必须与 HTML 保持同一份内容，缓存了旧 payload 而 HTML 是新的会导致
    # 页面数据与结构对不上，因此和 HTML 同样不缓存。
    location ~* /_payload\.json$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # sitemap、robots 与 sitemap 样式表按小时缓存
    location ~* /(sitemap.*\.xml|robots\.txt|style\.xsl)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ---------- 路由 ----------
    # 预渲染产物是目录 + index.html 结构：/about/ → /about/index.html。
    # 未命中时交给 404.html（项目内还有 catch-all 路由兜底）。
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
