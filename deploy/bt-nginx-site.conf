server
{
    listen 80;
    server_name www.daxiaoxiang.com daxiaoxiang.com;

    # 纯静态站点：只找 index.html，不再尝试 index.php
    index index.html;

    root /www/wwwroot/daxiaoxiangsitev2.1.0;

    include /www/server/panel/vhost/nginx/extension/www.daxiaoxiang.com/*.conf;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/www.daxiaoxiang.com.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/www.daxiaoxiang.com.conf;
    #REWRITE-END

    # ============================================================
    # 以下为站点自定义配置
    #
    # 重要：缺少压缩与缓存时，Lighthouse Performance 实测只有 79；
    # 配好后是 93。这两块不是可选项。
    # ============================================================

    # ---------- 压缩 ----------
    # 服务器在新加坡、访客主体在国内，跨境带宽是瓶颈
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # HSTS 等 HTTPS 配好并确认无误后再启用，过早开启会导致 HTTP 无法回退
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- 旧链接 301 ----------
    # v1.0 的路由拼写错误（abort → about）。
    # 静态产物本身不含真正的 301：Nitro 只会生成一个 meta refresh 页面，
    # 那对 SEO 不传递权重，必须由这里发出。
    location = /abort     { return 301 /about; }
    location = /abort/    { return 301 /about; }
    location = /en/abort  { return 301 /en/about; }
    location = /en/abort/ { return 301 /en/about; }

    # ---------- 带内容指纹的资源：长缓存 ----------
    # 文件名或路径含哈希，内容变了路径就变，可放心 immutable。
    # 用 ^~ 前缀匹配：命中后不再走后面的正则 location，优先级有保证。
    location ^~ /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /_ipx/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /_i18n/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # ---------- 文件名固定但更新极少的资源 ----------
    location ^~ /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /favicon.ico {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /apple-touch-icon.png {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---------- 不缓存 ----------
    # _payload.json 是各页面的数据，客户端导航时取用。
    # 它必须与 HTML 同策略：缓存了旧 payload 而 HTML 是新的，
    # 会导致页面数据与结构对不上。
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location ~* /_payload\.json$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ---------- sitemap 与 robots ----------
    location ~* /(sitemap.*\.xml|robots\.txt|style\.xsl)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ---------- 路由 ----------
    # 预渲染产物是「目录 + index.html」结构：/about/ 要能落到 /about/index.html。
    # 未命中时交给 404.html（项目内另有 catch-all 路由兜底）。
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ---------- 禁止访问的文件或目录 ----------
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md) {
        return 404;
    }

    # ---------- SSL 证书验证目录 ----------
    location ~ \.well-known {
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    access_log  /www/wwwlogs/www.daxiaoxiang.com.log;
    error_log   /www/wwwlogs/www.daxiaoxiang.com.error.log;
}
