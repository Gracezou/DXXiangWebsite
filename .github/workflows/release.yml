name: Release Build

# 构建静态产物并附加到 Release，供人工下载后部署到服务器。
#
# 触发方式：
#   1. 在 GitHub 网页上发布 Release 时自动触发（推荐）
#   2. 手动触发（Actions → Release Build → Run workflow），可指定任意分支或标签
#
# 说明：release 事件触发时，GitHub 使用「默认分支」上的 workflow 文件，
# 但检出的是 Release 对应标签的代码。因此本文件只需存在于 master 即可，
# 无需回填到历史标签。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支或标签（留空则用当前分支）"
        required: false
        default: ""

permissions:
  contents: write # 需要写权限才能把产物附加到 Release

jobs:
  build:
    name: 构建静态产物
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # 不指定 version：pnpm/action-setup 会从 package.json 的 packageManager
      # 字段读取。两处都写会报 ERR_PNPM_BAD_PM_VERSION，且版本只该有一处定义。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 静态生成
        run: pnpm generate

      - name: 校验产物
        run: |
          set -e
          test -f .output/public/index.html || { echo "缺少 index.html"; exit 1; }
          test -d .output/public/_nuxt      || { echo "缺少 _nuxt 目录"; exit 1; }
          test -f .output/public/404.html   || { echo "缺少 404.html"; exit 1; }

          PAGES=$(find .output/public -name '*.html' | wc -l | tr -d ' ')
          SIZE=$(du -sh .output/public | cut -f1)
          echo "页面数：$PAGES，体积：$SIZE"
          [ "$PAGES" -ge 13 ] || { echo "页面数少于预期（应为 13）"; exit 1; }

          # 中英双语页面齐全
          for p in about solution contact policy; do
            test -f ".output/public/$p/index.html"    || { echo "缺少 /$p"; exit 1; }
            test -f ".output/public/en/$p/index.html" || { echo "缺少 /en/$p"; exit 1; }
          done
          echo "产物校验通过"

      - name: 打包
        id: pack
        run: |
          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          NAME="daxiaoxiang-site-${VERSION}.tar.gz"
          tar -czf "$NAME" -C .output/public .
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "打包完成：$NAME（$(du -h "$NAME" | cut -f1)）"

      - name: 生成校验和
        run: |
          sha256sum "${{ steps.pack.outputs.name }}" > "${{ steps.pack.outputs.name }}.sha256"
          cat "${{ steps.pack.outputs.name }}.sha256"

      - name: 上传为 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: |
            ${{ steps.pack.outputs.name }}
            ${{ steps.pack.outputs.name }}.sha256
          retention-days: 90

      - name: 附加到 Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pack.outputs.name }}
            ${{ steps.pack.outputs.name }}.sha256
