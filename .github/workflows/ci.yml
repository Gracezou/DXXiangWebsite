name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不指定 version：pnpm/action-setup 会从 package.json 的 packageManager
      # 字段读取。两处都写会报 ERR_PNPM_BAD_PM_VERSION，且版本只该有一处定义。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码规范检查
        run: pnpm lint

      - name: 格式检查
        run: pnpm format:check

      - name: 静态生成（构建产物 .output/public）
        run: pnpm generate
